{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="row-between">
    <h1>Staff Details</h1>
    <a class="btn" href="/add_staff/">Add staff+</a><br><br>
    </div>
    <div class="table-wrap">
    <table>
        <tr>
            <th>Name</th>
            <th>Actions</th>
        </tr>
        {% for i in s_d %}
        <tr>
            <td>{{i.username}}</td>
            <td>
                <a href="{% url 'edit_staff' i.id %}">Edit</a>
                <a class="btn btn-danger" href="{% url 'delete_staff' i.id %}" onclick="return confirm('Are you sure??')">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="2">No Staff Found</td></tr>
        {% endfor %}
    </table><br>
    </div>
    <a href="{% url 'admin_dash' %}">Return to Admin Dashboard</a>
</body>
</html>
